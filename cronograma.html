<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#383838;font-family:Roboto,Arial,sans-serif}.header{height:68px;box-shadow:0 2px 5px #0001;border-bottom:1px solid #eee}.header-inner,main,.footer-inner{width:min(100% - 64px,1110px);margin:auto}.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{width:120px;height:48px;display:flex;align-items:center;flex-shrink:0}.brand img{max-width:100%;max-height:100%;object-fit:contain}.nav{display:flex;gap:32px;white-space:nowrap;align-items:center}.nav a{font-size:16px;font-weight:600;color:#555;text-decoration:none}.nav a.active{color:#079bd6}main{margin-top:38px}.heading{font-size:28px;font-weight:800;line-height:1.2;margin:0;letter-spacing:-.3px}.controls{display:flex;gap:12px}.circle{height:36px;width:36px;border:1px solid #777;border-radius:50%;background:#fff;color:#444;cursor:pointer}.calendar{margin-top:28px;border:1px solid #dedede;border-radius:9px;overflow:hidden}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}.day-head{min-height:76px;background:#f7f7f7;border-bottom:1px solid #ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600}.date{width:34px;height:34px;border-radius:50%;background:#383838;color:#fff;display:grid;place-items:center;font-size:16px}.day-col{padding:10px 8px;border-right:1px solid #e5e5e5;min-width:0}.day-col:last-child{border-right:0}.event{border:1px solid #e2e2e2;border-radius:6px;padding:8px;margin-bottom:8px;min-height:55px;overflow:hidden}.time{font-size:12px;color:#666;margin-bottom:6px;white-space:nowrap}.event-name{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.15;font-weight:600;white-space:nowrap}.sport-icon{width:17px;height:17px;min-width:17px;border-radius:50%;display:inline-grid;place-items:center;background:#393939;color:#fff;font-size:9px}.section-two{margin-top:125px}.accordion{margin-top:20px}.sport-row{border-bottom:1px solid #e5e5e5}.sport-toggle{width:100%;min-height:50px;display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:0;color:#555;cursor:pointer;font-size:15px}.sport-toggle[aria-expanded=true]{color:#079bd6}.sport-toggle[aria-expanded=true] .sport-icon{background:#079bd6}.chevron{margin-left:auto;margin-right:22px;transition:transform .2s}.sport-toggle[aria-expanded=true] .chevron{transform:rotate(180deg)}.table-wrap{overflow-x:auto;padding-bottom:8px}.detail-table{width:100%;min-width:600px;border:1px solid #e2e2e2;border-spacing:0;border-radius:6px;overflow:hidden;font-size:13px}.detail-table td{padding:14px 12px;border-right:1px solid #e7e7e7;border-bottom:1px solid #e7e7e7;white-space:nowrap}.detail-table tr:last-child td{border-bottom:0}.detail-table td:last-child{border-right:0;font-weight:600}.detail-table td:first-child,.detail-table td:nth-child(2),.detail-table td:nth-child(4),.detail-table td:nth-child(5){font-weight:600}footer{height:55px;background:#f2f2f2;margin-top:150px;display:flex;align-items:center}.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:#666}
@media(max-width:800px){.header{height:auto;min-height:62px}.header-inner{width:calc(100% - 28px);padding:10px 0;gap:16px;align-items:flex-start}.brand{width:90px;height:40px}.nav{gap:16px;overflow-x:auto;padding:8px 0;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{font-size:12px}main{width:calc(100% - 32px);margin-top:28px}.heading{font-size:22px}.calendar{overflow-x:auto}.grid{min-width:760px}.section-two{margin-top:70px}.sport-toggle{font-size:13px;min-height:45px}.detail-table{font-size:11px}.detail-table td{padding:10px}footer{margin-top:80px}.footer-inner{width:calc(100% - 32px);font-size:10px}}
@media(max-width:480px){.header-inner{display:block}.brand{margin:0 auto 5px}.nav{width:100%;gap:18px}.nav a{font-size:11px}main{width:calc(100% - 28px)}.heading{font-size:19px}.circle{width:30px;height:30px}.section-two{margin-top:58px}footer{height:auto;min-height:52px;padding:12px 0}.footer-inner{align-items:flex-start;flex-direction:column;gap:5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
<a class="brand" href="index.html" aria-label="Página inicial"><img src="assets/img/logo-olimpiadas.png" alt="Olimpíadas da Advocacia" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none;font-size:10px;font-weight:800">OLIMPÍADAS<br>DA ADVOCACIA</span></a>
<nav class="nav" aria-label="Navegação principal"><a href="index.html">Home</a><a href="modalidades.html">Modalidades</a><a href="noticias.html">Notícias</a><a class="active" href="cronograma.html" aria-current="page">Cronograma</a><a href="resultados.html">Resultados</a><a href="administradores.html">Administradores</a><a href="regulamento.html">Regulamento</a></nav>
</div></header>
<main>
<section><div class="flex items-center justify-between gap-4"><h1 class="heading">CRONOGRAMA GERAL</h1><div class="controls"><button id="prev" class="circle" aria-label="Semana anterior"><i class="fa-solid fa-chevron-left"></i></button><button id="next" class="circle" aria-label="Próxima semana"><i class="fa-solid fa-chevron-right"></i></button></div></div><div class="calendar"><div id="calendar-grid" class="grid"></div></div></section>
<section class="section-two"><h2 class="heading">CRONOGRAMA POR MODALIDADES</h2><div id="accordion" class="accordion"></div></section>
</main>
<footer><div class="footer-inner"><strong>I Olimpíadas da Advocacia 2023</strong><span>2023 HC Sports. Todos os direitos reservados.</span></div></footer>
<script>
const days=[
['Seg',3,[['08:00 - 11:00','Vôlei de Quadra','volleyball'],['11:20 - 13:00','Natação','person-swimming'],['14:30 - 17:00','Futebol Society','futbol'],['16:00 - 18:00','Judô','person-falling']]],
['Ter',4,[['08:00 - 11:00','Basquete 3x3','basketball'],['10:00 - 13:00','Futebol 11','futbol'],['14:30 - 16:00','Futebol 7','futbol'],['16:20 - 18:00','Futebol Society','futbol'],['14:30 - 18:00','Jiu-Jitsu','hand-fist'],['16:00 - 18:00','Judô','person-falling']]],
['Qua',5,[['08:00 - 11:00','Vôlei de Quadra','volleyball'],['08:00 - 11:00','Basquete 3x3','basketball'],['10:00 - 13:00','Natação','person-swimming'],['14:30 - 18:00','Jiu-Jitsu','hand-fist'],['15:00 - 18:00','Corrida 5km','person-running']]],
['Qui',6,[['08:00 - 11:00','Vôlei de Quadra','volleyball'],['11:20 - 13:00','Natação','person-swimming'],['14:30 - 17:00','Futebol Society','futbol'],['16:00 - 18:00','Judô','person-falling']]],
['Sex',7,[['08:00 - 11:00','Basquete 3x3','basketball'],['10:00 - 13:00','Futebol 11','futbol'],['14:30 - 16:00','Futebol 7','futbol'],['16:20 - 18:00','Futebol Society','futbol'],['14:30 - 18:00','Jiu-Jitsu','hand-fist'],['16:00 - 18:00','Judô','person-falling']]],
['Sáb',8,[['08:00 - 11:00','Vôlei de Quadra','volleyball'],['08:00 - 11:00','Basquete 3x3','basketball'],['10:00 - 13:00','Natação','person-swimming'],['14:30 - 18:00','Jiu-Jitsu','hand-fist'],['15:00 - 18:00','Corrida 5km','person-running']]]];
const sports=[['Basquete 3x3','basketball'],['Beach Tennis','table-tennis-paddle-ball'],['Corrida de Rua','person-running'],['Crossfit','dumbbell'],['Futebol 11','futbol'],['Futebol 7','futbol'],['Futebol Society','futbol'],['Futebol de Mesa','futbol'],['Futevôlei','volleyball'],['Jiu-Jitsu','hand-fist'],['Judô','person-falling'],['Natação','person-swimming'],['Sinuca','circle-dot'],['Tênis','table-tennis-paddle-ball'],['Tênis de Mesa','table-tennis-paddle-ball'],['Tiro Esportivo','bullseye'],['Vôlei de Quadra','volleyball'],['Vôlei de Praia','volleyball'],['Xadrez','chess']];
const ico=t=>`<span class="sport-icon"><i class="fa-solid fa-${t}"></i></span>`;let offset=0;
function drawCalendar(){document.querySelector('#calendar-grid').innerHTML=days.map(d=>`<div class="day-head"><span>${d[0]}</span><span class="date">${d[1]+offset*7}</span></div>`).join('')+days.map(d=>`<div class="day-col">${d[2].map(e=>`<div class="event"><div class="time">${e[0]}</div><div class="event-name">${ico(e[2])}<span>${e[1]}</span></div></div>`).join('')}</div>`).join('')}
const rows=['03/07/2023|09h00|Lorem Ipsum is simply dummy text|Jogo 1|Grupo A|Equipe 1 x Equipe 2','03/07/2023|11h00|Lorem Ipsum is simply dummy text|Jogo 2|Grupo A|Equipe 2 x Equipe 3','03/07/2023|14h00|Lorem Ipsum is simply dummy text|Jogo 3|Grupo A|Equipe 1 x Equipe 3','04/07/2023|10h00|Lorem Ipsum is simply dummy text|Jogo 4|Grupo A|Final','04/07/2023|15h00|Lorem Ipsum is simply dummy text|Jogo 5|Grupo A|2º melhor colocado x 3º melhor colocado'];
document.querySelector('#accordion').innerHTML=sports.map((s,i)=>`<div class="sport-row"><button class="sport-toggle" aria-expanded="${s[0]==='Futebol 11'}" aria-controls="detail-${i}">${ico(s[1])}<span>${s[0]}</span><i class="fa-solid fa-chevron-down chevron"></i></button><div id="detail-${i}" class="table-wrap" ${s[0]==='Futebol 11'?'':'hidden'}><table class="detail-table"><tbody>${rows.map(r=>`<tr>${r.split('|').map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');
document.querySelectorAll('.sport-toggle').forEach(b=>b.addEventListener('click',()=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));document.getElementById(b.getAttribute('aria-controls')).hidden=open}));
document.querySelector('#prev').addEventListener('click',()=>{offset--;drawCalendar()});document.querySelector('#next').addEventListener('click',()=>{offset++;drawCalendar()});drawCalendar();
</script>
</body></html>
