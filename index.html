<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>

  <title>Nobre Piscinas</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link

    rel="stylesheet"
  >

<body>

  <!-- SEÇÃO: HEADER (responsável: integrante A) -->

  <!-- SEÇÃO: HERO (responsável: integrante B) -->
  <section
    class="hero min-h-[310px] sm:min-h-[420px] lg:min-h-[500px] bg-cover bg-center"
    style="
      background-image:
        linear-gradient(
          90deg,
          rgba(0, 94, 160, 0.72) 0%,
          rgba(0, 119, 190, 0.42) 42%,
          rgba(0, 0, 0, 0.02) 72%
        ),
        url('https://pontospravoar.com/wp-content/uploads/2023/12/Parque-Aquatico.jpg');
    "
  >
    <div class="hero-content w-full max-w-6xl justify-start px-5 py-12 sm:px-8 lg:px-12">
      <div class="max-w-[560px] text-white">

        <h1 class="mb-5 text-4xl font-bold leading-[1.08] sm:text-5xl lg:text-6xl">
          <span class="text-[#ff8a1f]">Experiência no DNA</span>
          na fabricação de piscinas de fibra
        </h1>

        <p class="mb-7 max-w-[520px] text-sm leading-relaxed text-white/95 sm:text-base">
          Uma nova marca que já nasce com 25 anos de história para contar.
          A Nobre Piscinas possui em seu DNA a experiência de produzir piscinas
          de fibra de vidro.
        </p>

        <div class="flex flex-col gap-3 sm:flex-row">
          <a
            href="#sobre"
            class="btn border-none bg-[#ff8a1f] px-6 text-xs font-semibold text-white hover:bg-[#ed7912]"
          >
            &gt;&gt;&gt;&nbsp; CONHEÇA NOSSA HISTÓRIA
          </a>

          <a
            href="#piscinas"
            class="btn btn-outline border-white px-8 text-xs font-semibold text-white hover:border-white hover:bg-white hover:text-[#18377c]"
          >
            VER PISCINAS
          </a>
        </div>

      </div>
    </div>
  </section>
