<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Compra de créditos | AgênciaWeb</title>

  <!-- DaisyUI + Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: #f4f3f3;
      font-family: Arial, Helvetica, sans-serif;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="mx-auto mt-[34px] min-h-[calc(100vh-46px)] w-[min(1180px,calc(100%-72px))] overflow-hidden bg-white">

    <!-- HEADER -->
    <header class="navbar min-h-[67px] border-b border-[#dedede] bg-[#fafafa] px-[25px]">

      <div class="flex-1">
        <a href="dashboard.html" class="inline-flex items-center">
          <img
            src="img/logo-agenciaweb.png"
            alt="AgênciaWeb Escolar"
            class="w-[150px] h-auto object-contain"
          />
        </a>
      </div>

      <div class="flex-none">
        <div class="flex items-center gap-2">

          <div class="avatar placeholder">
            <div class="grid h-7 w-7 place-items-center rounded-[4px] bg-[#f4a046] text-[10px] font-bold text-white">
              LD
            </div>
          </div>

          <div class="leading-tight">
            <div class="text-[11px] font-bold text-[#333]">
              John Doe
            </div>

            <div class="mt-[2px] text-[9px] text-[#8b8b8b]">
              Agência Web
            </div>
          </div>

        </div>
      </div>

    </header>

    <div class="flex min-h-[calc(100vh-113px)]">

      <!-- SIDEBAR -->
      <aside class="w-[205px] shrink-0 border-r border-[#dedede] bg-white px-[25px] pt-[25px]">

        <h1 class="mb-6 text-[20px] font-bold text-[#505050]">
          Canal do cliente
        </h1>

        <nav aria-label="Menu do cliente">

          <ul class="menu w-full p-0 text-[11px]">

            <!-- LOJA DE PROJETOS -->
            <li class="mb-6">

              <div class="pointer-events-none flex min-h-0 items-center gap-2 bg-transparent p-0 text-[#747474] hover:bg-transparent">

                <svg
                  class="h-4 w-4 text-[#1b5f9e]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="5" width="13" height="10"></rect>
                  <path d="M6 18H4.5A1.5 1.5 0 0 1 3 16.5V5"></path>
                  <circle cx="17.5" cy="15.5" r="3"></circle>
                  <path d="M17.5 14v1.7l1 .7"></path>
                </svg>

                <span>
                  Loja de projetos
                </span>

              </div>

              <ul class="mt-3 gap-1 pl-[25px]">

                <li>
                  <a
                    href="dashboard.html"
                    class="min-h-0 rounded-none bg-transparent px-0 py-[6px] text-[#888] hover:bg-transparent hover:text-[#0758a6]"
                  >
                    Dashboard
                  </a>
                </li>

                <li>
                  <a
                    href="compra.html"
                    class="min-h-0 rounded-none bg-transparent px-0 py-[6px] font-bold text-[#0758a6] hover:bg-transparent hover:text-[#0758a6]"
                  >
                    Compra de créditos
                  </a>
                </li>

                <li>
                  <a
                    href="#"
                    class="min-h-0 rounded-none bg-transparent px-0 py-[6px] text-[#888] hover:bg-transparent hover:text-[#0758a6]"
                  >
                    Concluídos
                  </a>
                </li>

              </ul>

            </li>

            <!-- GESTÃO DE PROJETOS -->
            <li class="mb-6">

              <a
                href="#"
                class="min-h-0 gap-2 rounded-none bg-transparent p-0 text-[#747474] hover:bg-transparent hover:text-[#0758a6]"
              >

                <svg
                  class="h-4 w-4 text-[#1b5f9e]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="8"></circle>
                  <path d="M12 4v8l5.5 5.5"></path>
                  <path d="M12 12h8"></path>
                </svg>

                Gestão de projetos

              </a>

            </li>

            <!-- CAMPANHAS -->
            <li>

              <a
                href="#"
                class="min-h-0 gap-2 rounded-none bg-transparent p-0 text-[#747474] hover:bg-transparent hover:text-[#0758a6]"
              >

                <svg
                  class="h-4 w-4 text-[#1b5f9e]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 13h3l8-4v8l-8-4H4z"></path>
                  <path d="M7 13v5"></path>
                  <path d="M17 10.5 19 9"></path>
                  <path d="M17.5 13H21"></path>
                  <path d="M17 15.5 19 17"></path>
                </svg>

                Campanhas

              </a>

            </li>

          </ul>

        </nav>

      </aside>

      <!-- CONTEÚDO DOS OUTROS INTEGRANTES -->
      <main class="min-w-0 flex-1 bg-white">
        <!-- Conteúdo da compra entra aqui -->
      </main>

    </div>

  </div>

</body>
</html>
